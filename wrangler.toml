name = "scan-dienst"
main = "src/index.js"
compatibility_date = "2024-09-23"
# Im Dashboard angelegte Variablen bei einer Bereitstellung nicht löschen
keep_vars = true

# Protokolle (z. B. Gemini-Fehler) im Cloudflare-Dashboard unter „Logs“ sichtbar
[observability]
enabled = true

# GEMINI_API_KEY im Dashboard unter Einstellungen → Variablen und Geheimnisse als Typ „Geheimnis“ anlegen
# (oder: npx wrangler secret put GEMINI_API_KEY). Optional als Variable: GEMINI_MODEL.
